<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>和平精英 · 炸队友模拟器</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;user-select:none;
    -webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}

  /* 准星 */
  #crosshair{position:fixed;left:50%;top:50%;width:26px;height:26px;
    transform:translate(-50%,-50%);pointer-events:none;z-index:10}
  #crosshair i{position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 3px #000}
  #crosshair i:nth-child(1){left:50%;top:0;width:2px;height:8px;transform:translateX(-50%)}
  #crosshair i:nth-child(2){left:50%;bottom:0;width:2px;height:8px;transform:translateX(-50%)}
  #crosshair i:nth-child(3){top:50%;left:0;height:2px;width:8px;transform:translateY(-50%)}
  #crosshair i:nth-child(4){top:50%;right:0;height:2px;width:8px;transform:translateY(-50%)}
  #crosshair i:nth-child(5){left:50%;top:50%;width:3px;height:3px;border-radius:50%;
    transform:translate(-50%,-50%);background:#ffdd55}

  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:9}
  .panel{position:absolute;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.9);
    font-weight:700;letter-spacing:1px}
  #score{top:18px;left:22px;font-size:20px;line-height:1.6}
  #score b{color:#ffdd55;font-size:30px}
  #score .sub{font-size:13px;font-weight:400;opacity:.8}
  #score .alive{color:#7dffb0}
  #hpPanel{top:126px;left:22px;font-size:13px;font-weight:400;opacity:.95}
  #hpPanel .hpbar{width:170px;height:11px;margin-top:5px;border-radius:6px;
    background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3);overflow:hidden}
  #hpPanel .hpbar span{display:block;height:100%;width:100%;
    background:linear-gradient(90deg,#4ade80,#22c55e);transition:width .12s linear}
  #tip{bottom:24px;left:50%;transform:translateX(-50%);font-size:14px;
    opacity:.75;font-weight:400;text-align:center;white-space:nowrap}
  #nade{right:26px;bottom:24px;text-align:right;font-size:15px;line-height:1.5}
  #nade .bar{width:150px;height:7px;background:rgba(0,0,0,.5);border-radius:4px;
    margin-top:6px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
  #nade .bar span{display:block;height:100%;width:100%;
    background:linear-gradient(90deg,#ffdd55,#ff7744);transform-origin:left}
  #combo{top:26%;left:50%;transform:translateX(-50%) scale(.6);
    font-size:52px;color:#ff5544;font-weight:900;opacity:0;
    transition:opacity .18s,transform .18s;text-shadow:0 0 24px #ff3300,0 4px 0 #7a0000}
  #combo.show{opacity:1;transform:translateX(-50%) scale(1)}

  /* 提示通知栏 */
  #notices{position:fixed;top:14px;left:50%;transform:translateX(-50%);
    z-index:12;display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;max-width:90vw}
  .notice{padding:6px 20px;border-radius:20px;font-size:15px;font-weight:700;
    letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.8);
    background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);
    white-space:nowrap;animation:noticeIn .25s ease-out;
    transition:opacity .4s,transform .4s}
  .notice.kill{color:#ff8866;border-color:rgba(255,120,80,.5);
    background:rgba(60,10,0,.5)}
  .notice.join{color:#7dffb0;border-color:rgba(100,255,160,.4)}
  .notice.heal{color:#8ef0ff;border-color:rgba(120,230,255,.45);
    background:rgba(0,40,55,.55)}
  .notice.out{opacity:0;transform:translateY(-10px)}
  @keyframes noticeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* 受伤红屏 */
  #hurt{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;
    box-shadow:inset 0 0 140px rgba(255,0,0,.9)}

  /* 虚拟摇杆 */
  #joystick{position:fixed;left:26px;bottom:30px;width:140px;height:140px;
    display:none;z-index:15;touch-action:none}
  #stickBase{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,.06));
    border:2px solid rgba(255,255,255,.35);box-shadow:0 0 24px rgba(0,0,0,.5);
    touch-action:none}
  #stickKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;
    border-radius:50%;background:rgba(255,255,255,.5);
    border:2px solid rgba(255,255,255,.8);box-shadow:0 3px 10px rgba(0,0,0,.6);
    pointer-events:none}
  #throwBtn{position:fixed;right:30px;bottom:44px;width:96px;height:96px;
    border-radius:50%;display:none;align-items:center;justify-content:center;
    z-index:15;touch-action:none;color:#fff;font-size:16px;font-weight:800;
    letter-spacing:2px;border:3px solid rgba(255,190,80,.85);
    background:radial-gradient(circle,rgba(255,140,50,.75),rgba(160,50,10,.8));
    box-shadow:0 0 22px rgba(255,140,50,.5);pointer-events:auto;
    -webkit-tap-highlight-color:transparent}
  #throwBtn:active{transform:scale(.94)}

  /* 开始遮罩 */
  #overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(circle at 50% 40%,rgba(20,40,60,.85),rgba(0,0,0,.96));
    transition:opacity .25s;text-align:center;padding:20px}
  #overlay.hide{opacity:0;pointer-events:none;display:none}
  #overlay h1{font-size:42px;color:#ffdd55;letter-spacing:4px;
    text-shadow:0 0 30px #ff8800,0 4px 0 #8a3b00}
  #overlay h2{font-size:15px;color:#9fd0ff;font-weight:400;letter-spacing:6px}
  #overlay .box{color:#cfe6ff;font-size:14px;line-height:2;opacity:.9}
  #overlay .box b{color:#ffdd55}
  #overlay .modeRow{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  #overlay .go{padding:14px 34px;border:2px solid #ffdd55;cursor:pointer;
    border-radius:40px;color:#ffdd55;font-size:18px;font-weight:700;letter-spacing:2px;
    animation:breathe 1.6s ease-in-out infinite;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #overlay .go.stick{border-color:#7dd6ff;color:#7dd6ff;
    animation-delay:.4s;box-shadow:none}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 rgba(255,221,85,0);transform:scale(1)}
    50%{box-shadow:0 0 26px rgba(255,221,85,.5);transform:scale(1.04)}}

  /* Game Over */
  #gameover{position:fixed;inset:0;z-index:21;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(circle at 50% 40%,rgba(70,8,8,.92),rgba(0,0,0,.98));
    text-align:center;padding:20px}
  #gameover.show{display:flex}
  #gameover h1{font-size:40px;color:#ff5544;letter-spacing:4px;
    text-shadow:0 0 30px #ff2200,0 4px 0 #5a0000}
  #gameover h2{font-size:16px;color:#ffb0a0;font-weight:400;letter-spacing:10px}
  #gameover .stats{color:#ffd9cc;font-size:16px;line-height:2;opacity:.95;
    margin:6px 0 4px}
  #gameover .stats b{color:#ffdd55}
  #gameover .go{padding:14px 46px;border:2px solid #ff5544;cursor:pointer;
    border-radius:40px;color:#ff8877;font-size:19px;font-weight:700;letter-spacing:3px;
    animation:breathe 1.6s ease-in-out infinite;margin-top:8px;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
</style>
</head>
<body>
<div id="crosshair"><i></i><i></i><i></i><i></i><i></i></div>

<div id="hud">
  <div class="panel" id="score">已炸飞队友：<b id="kills">0</b> 名<br>
    <span class="sub">投出雷数：<span id="throws">0</span></span><br>
    <span class="sub alive" id="alive">存活队友：12</span></div>
  <div class="panel" id="hpPanel">生命值
    <div class="hpbar"><span id="hpfill"></span></div>
  </div>
  <div class="panel" id="combo"></div>
  <div class="panel" id="nade">手雷 · 就绪<div class="bar"><span id="cd"></span></div></div>
  <div class="panel" id="tip">左键 / 空格 投雷　·　WASD 移动　·　Shift 疾跑　·　M 静音</div>
</div>

<div id="joystick">
  <div id="stickBase"><div id="stickKnob"></div></div>
</div>
<div id="throwBtn">投雷</div>

<div id="notices"></div>
<div id="hurt"></div>
<div id="flash"></div>

<div id="overlay">
  <h1>炸 队 友 模 拟 器</h1>
  <h2>和平精英 · 队友歼灭战</h2>
  <div class="box">
    <b>WASD</b> 移动　<b>Shift</b> 疾跑　<b>左键/空格</b> 投雷　<b>M</b> 静音<br>
    手雷也会炸到自己，<b style="color:#ff7766">血量归零即游戏结束</b><br>
    靠近地图上的<b>医疗包</b>可回复生命值，医疗包会持续补充
  </div>
  <div class="modeRow">
    <div class="go" id="startKbm">键鼠模式</div>
    <div class="go stick" id="startStick">触屏摇杆</div>
  </div>
</div>

<div id="gameover">
  <h1>你 把 自 己 炸 死 了</h1>
  <h2>GAME OVER</h2>
  <div class="stats" id="goStats"></div>
  <div class="go" id="restartBtn">再 来 一 局</div>
</div>

<audio id="bgm" src="music.mp3" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
/* ============================================================
   和平精英 · 炸队友模拟器  (Three.js)
   ============================================================ */

// ---------- 基础工具 ----------
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- 渲染器 / 场景 / 相机 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9ec4e8, 55, 190);

(function sky() {
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#3f86d0');
  g.addColorStop(0.5, '#9ec4e8');
  g.addColorStop(1, '#dceaf6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 2, 256);
  scene.background = new THREE.CanvasTexture(c);
})();

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 600);
camera.rotation.order = 'YXZ';
scene.add(camera);

// ---------- 灯光 ----------
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x556644, 0.95));
const sun = new THREE.DirectionalLight(0xfff3d6, 1.35);
sun.position.set(45, 75, 35);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -70;
sun.shadow.camera.right = 70;
sun.shadow.camera.top = 70;
sun.shadow.camera.bottom = -70;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 220;
sun.shadow.bias = -0.0008;
scene.add(sun);

// ---------- 地面 ----------
(function ground() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#5d7a49'; ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4000; i++) {
    const r = 65 + Math.random() * 45;
    const g = 95 + Math.random() * 55;
    const b = 45 + Math.random() * 35;
    ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${Math.random() * 0.55})`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 2.5, 2.5);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(70, 70);
  tex.anisotropy = 4;

  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(500, 500),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 1 })
  );
  m.rotation.x = -Math.PI / 2;
  m.receiveShadow = true;
  scene.add(m);
})();

// ---------- 场景搭建 ----------
const obstacles = [];
const buildingMeshes = [];

function addBuilding(x, z, w, d, h, color) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.95 })
  );
  m.position.set(x, h / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  buildingMeshes.push(m);
  obstacles.push({ x, z, w, d, h });

  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w + 0.6, 0.3, d + 0.6),
    new THREE.MeshStandardMaterial({ color: 0x6b5645, roughness: 1 })
  );
  roof.position.set(x, h + 0.15, z);
  roof.castShadow = true;
  scene.add(roof);
  buildingMeshes.push(roof);
}

function addCrate(x, z, s, color) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(s, s, s),
    new THREE.MeshStandardMaterial({ color, roughness: 0.9 })
  );
  m.position.set(x, s / 2, z);
  m.rotation.y = Math.random() * Math.PI;
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  obstacles.push({ x, z, w: s * 0.95, d: s * 0.95, h: s });
}

addBuilding(-18, -14, 9, 7, 4.5, 0xc2b39a);
addBuilding(16, -12, 7, 8, 3.8, 0xb0a189);
addBuilding(0, -32, 15, 8, 5.5, 0xcabca4);
addBuilding(-30, 9, 10, 6, 3.2, 0xa89a84);
addBuilding(25, 17, 8, 8, 4.2, 0xc2b39a);
addBuilding(-9, 24, 6, 6, 3.0, 0xb0a189);

for (let i = 0; i < 26; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 9 + Math.random() * 44;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (Math.hypot(x, z) < 7) continue;
  addCrate(x, z, 0.9 + Math.random() * 1.1,
    Math.random() < 0.55 ? 0x8a6b45 : 0x6e7a4a);
}

(function trees() {
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5b4530, roughness: 1 });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f6b35, roughness: 1 });
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 34 + Math.random() * 55;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const h = 2.5 + Math.random() * 2.5;
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, h, 6), trunkMat);
    trunk.position.y = h / 2; trunk.castShadow = true;
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(1.6 + Math.random(), 3 + Math.random() * 2, 7), leafMat);
    leaf.position.y = h + 1.1; leaf.castShadow = true;
    g.add(trunk, leaf);
    g.position.set(x, 0, z);
    scene.add(g);
  }
})();

// ---------- 线段 / AABB 检测（AI 避障用） ----------
// 线段与轴对齐矩形是否相交（slab 方法）
function segAABB(x0, z0, dx, dz, minX, minZ, maxX, maxZ) {
  let tmin = 0, tmax = 1;

  if (Math.abs(dx) < 1e-8) {
    if (x0 < minX || x0 > maxX) return false;
  } else {
    let t1 = (minX - x0) / dx;
    let t2 = (maxX - x0) / dx;
    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
    if (t1 > tmin) tmin = t1;
    if (t2 < tmax) tmax = t2;
    if (tmin > tmax) return false;
  }

  if (Math.abs(dz) < 1e-8) {
    if (z0 < minZ || z0 > maxZ) return false;
  } else {
    let t1 = (minZ - z0) / dz;
    let t2 = (maxZ - z0) / dz;
    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
    if (t1 > tmin) tmin = t1;
    if (t2 < tmax) tmax = t2;
    if (tmin > tmax) return false;
  }

  return true;
}

// 从 (x0,z0) 到 (x1,z1) 的线段是否被障碍物阻挡（考虑半径）
function segmentBlocked(x0, z0, x1, z1, radius) {
  const dx = x1 - x0;
  const dz = z1 - z0;

  const loX = Math.min(x0, x1) - radius;
  const hiX = Math.max(x0, x1) + radius;
  const loZ = Math.min(z0, z1) - radius;
  const hiZ = Math.max(z0, z1) + radius;

  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    const ohw = o.w / 2;
    const ohd = o.d / 2;

    // 粗筛：AABB 不相交直接跳过
    if (o.x + ohw < loX || o.x - ohw > hiX) continue;
    if (o.z + ohd < loZ || o.z - ohd > hiZ) continue;

    // 起点已在该障碍的贴身范围内，跳过（避免贴墙时寸步难行）
    if (Math.abs(x0 - o.x) < ohw + 0.3 && Math.abs(z0 - o.z) < ohd + 0.3) continue;

    const hw = ohw + radius;
    const hd = ohd + radius;
    if (segAABB(x0, z0, dx, dz, o.x - hw, o.z - hd, o.x + hw, o.z + hd)) {
      return true;
    }
  }
  return false;
}

// 某点是否落在障碍物内（可指定额外半径）
function pointBlocked(x, z, radius) {
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (Math.abs(x - o.x) < o.w / 2 + radius &&
        Math.abs(z - o.z) < o.d / 2 + radius) {
      return true;
    }
  }
  return false;
}

// 绕障转向：按角度从正前方往两侧尝试，找到第一个前方通畅的方向
const _steerAngles = [0, 0.35, -0.35, 0.7, -0.7, 1.05, -1.05,
                      1.4, -1.4, 1.8, -1.8, 2.3, -2.3, 2.8, -2.8];

function steerAround(pos, dir, radius, probe) {
  const baseAngle = Math.atan2(dir.x, dir.z);
  for (let i = 0; i < _steerAngles.length; i++) {
    const a = baseAngle + _steerAngles[i];
    const nx = Math.sin(a), nz = Math.cos(a);
    const tx = pos.x + nx * probe;
    const tz = pos.z + nz * probe;
    if (!segmentBlocked(pos.x, pos.z, tx, tz, radius)) {
      if (i === 0) return dir;
      return new THREE.Vector3(nx, 0, nz);
    }
  }
  return dir;
}

// ---------- 特效管理 ----------
const effects = [];
const floaters = [];
function addEffect(fn) { effects.push(fn); }

function spawnFloater(pos, text, color = '#ffdd55', scale = 1) {
  const cv = document.createElement('canvas');
  let ctx = cv.getContext('2d');
  const FS = 56;
  ctx.font = `bold ${FS}px "Microsoft YaHei",sans-serif`;
  const w = Math.ceil(ctx.measureText(text).width) + 40;
  cv.width = w; cv.height = 90;
  ctx = cv.getContext('2d');
  ctx.font = `bold ${FS}px "Microsoft YaHei",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(0,0,0,.82)';
  ctx.strokeText(text, w / 2, 45);
  ctx.fillStyle = color;
  ctx.fillText(text, w / 2, 45);

  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false
  }));
  sp.scale.set((w / 90) * 1.15 * scale, 1.15 * scale, 1);
  sp.position.copy(pos);
  sp.position.y += 2.0;
  scene.add(sp);
  floaters.push({ sp, life: 1.7, max: 1.7 });
}

// ---------- 通知栏 ----------
const noticesEl = document.getElementById('notices');
function notice(text, type = 'join') {
  const d = document.createElement('div');
  d.className = 'notice ' + type;
  d.textContent = text;
  noticesEl.appendChild(d);
  while (noticesEl.children.length > 6) noticesEl.removeChild(noticesEl.firstChild);
  setTimeout(() => {
    d.classList.add('out');
    setTimeout(() => d.remove(), 450);
  }, 2600);
}

// ---------- 玩家 ----------
const player = {
  pos: new THREE.Vector3(0, 1.7, 0),
  yaw: 0, pitch: 0,
  vel: new THREE.Vector3(),
  bob: 0
};

let playerHP = 100;
let hurtAlpha = 0;
const PLAYER_BOOM_RADIUS = 6;
const TEAM_BOOM_RADIUS = 16;

const hpFillEl = document.getElementById('hpfill');
const hurtEl = document.getElementById('hurt');

function updateHPUI() {
  const v = clamp(playerHP, 0, 100);
  hpFillEl.style.width = v + '%';
  hpFillEl.style.background = v > 50
    ? 'linear-gradient(90deg,#4ade80,#22c55e)'
    : v > 25
      ? 'linear-gradient(90deg,#fbbf24,#f59e0b)'
      : 'linear-gradient(90deg,#ef4444,#dc2626)';
}
updateHPUI();

function damagePlayer(dmg) {
  playerHP -= dmg;
  hurtAlpha = Math.min(1, hurtAlpha + 0.55 + dmg / 220);
  shake = Math.max(shake, 0.9);

  if (playerHP <= 0) {
    playerHP = 0;
    updateHPUI();
    hurtAlpha = 1;
    gameOver();
    return;
  }
  updateHPUI();
}

// ---------- 通用点击绑定 ----------
function bindTap(el, fn) {
  if (!el) return;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    fn(e);
  });
}

const joystickEl = document.getElementById('joystick');
const stickBase = document.getElementById('stickBase');
const stickKnob = document.getElementById('stickKnob');
const throwBtn = document.getElementById('throwBtn');

let stickPointerId = null;
let stickCenter = { x: 0, y: 0 };
let joyX = 0;
let joyUp = 0;

function setStickFromPoint(cx, cy) {
  const MAX = 52;
  let dx = cx - stickCenter.x;
  let dy = cy - stickCenter.y;
  const d = Math.hypot(dx, dy);
  if (d > MAX) { dx = dx / d * MAX; dy = dy / d * MAX; }
  stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  joyX = dx / MAX;
  joyUp = -dy / MAX;
}

stickBase.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (stickPointerId !== null) return;
  e.preventDefault();
  e.stopPropagation();
  stickPointerId = e.pointerId;
  try { stickBase.setPointerCapture(e.pointerId); } catch (_) {}
  const r = stickBase.getBoundingClientRect();
  stickCenter.x = r.left + r.width / 2;
  stickCenter.y = r.top + r.height / 2;
  setStickFromPoint(e.clientX, e.clientY);
});

stickBase.addEventListener('pointermove', e => {
  if (e.pointerId !== stickPointerId) return;
  e.preventDefault();
  setStickFromPoint(e.clientX, e.clientY);
});

function releaseStick(e) {
  if (e.pointerId !== stickPointerId) return;
  stickPointerId = null;
  joyX = 0; joyUp = 0;
  stickKnob.style.transform = 'translate(0,0)';
}
stickBase.addEventListener('pointerup', releaseStick);
stickBase.addEventListener('pointercancel', releaseStick);

let lookPointerId = null;
let lastLX = 0, lastLY = 0;

window.addEventListener('pointerdown', e => {
  if (inputMode !== 'stick' || paused || gameIsOver) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (lookPointerId !== null) return;
  if (e.target.closest && e.target.closest('#joystick, #throwBtn')) return;
  lookPointerId = e.pointerId;
  lastLX = e.clientX;
  lastLY = e.clientY;
});

window.addEventListener('pointermove', e => {
  if (e.pointerId !== lookPointerId) return;
  const dx = e.clientX - lastLX;
  const dy = e.clientY - lastLY;
  lastLX = e.clientX;
  lastLY = e.clientY;
  player.yaw -= dx * 0.0045;
  player.pitch = clamp(player.pitch - dy * 0.0045,
    -Math.PI / 2 + 0.06, Math.PI / 2 - 0.06);
});

function endLookPointer(e) {
  if (e.pointerId === lookPointerId) lookPointerId = null;
}
window.addEventListener('pointerup', endLookPointer);

// ---------- 手雷 ----------
const grenades = [];
let throwCooldown = 0;
const COOLDOWN = 0.45;
let throwCount = 0;
let koCount = 0;
let shake = 0;
let comboCount = 0;
let comboTimer = 0;

const nadeGeo = new THREE.SphereGeometry(0.14, 10, 8);
const nadeMat = new THREE.MeshStandardMaterial({
  color: 0x35452f, roughness: 0.55, metalness: 0.55
});
const fuzeGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.1, 6);
const fuzeMat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.8, roughness: 0.3 });

function tryThrow() {
  if (throwCooldown > 0 || paused || gameIsOver) return;
  throwCooldown = COOLDOWN;
  throwCount++;
  document.getElementById('throws').textContent = throwCount;

  const dir = new THREE.Vector3(0, 0, -1).applyEuler(
    new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ')
  );

  const mesh = new THREE.Mesh(nadeGeo, nadeMat);
  const fz = new THREE.Mesh(fuzeGeo, fuzeMat);
  fz.position.y = 0.16;
  mesh.add(fz);

  mesh.position.copy(player.pos).addScaledVector(dir, 0.7);
  mesh.position.y -= 0.2;
  mesh.castShadow = true;
  scene.add(mesh);

  grenades.push({
    mesh,
    vel: dir.clone().multiplyScalar(23).add(new THREE.Vector3(0, 3.2, 0)),
    timer: 2.0,
    spin: new THREE.Vector3((Math.random() - 0.5) * 22, 0, (Math.random() - 0.5) * 22)
  });

  for (const t of teammates) {
    if (t.state !== 'alive') continue;
    if (t.group.position.distanceTo(mesh.position) < 16 && Math.random() < 0.65) {
      t.flee(mesh.position);
    }
  }
}

function collideGrenade(g) {
  const p = g.mesh.position;
  const r = 0.15;

  for (const o of obstacles) {
    const h = o.h || 4;
    const hw = o.w / 2 + r;
    const hd = o.d / 2 + r;

    const dx = p.x - o.x;
    const dz = p.z - o.z;

    if (Math.abs(dx) >= hw || Math.abs(dz) >= hd) continue;
    if (p.y >= h + r) continue;
    if (p.y < -2) continue;

    const px = hw - Math.abs(dx);
    const pz = hd - Math.abs(dz);
    const py = h + r - p.y;

    if (py < px && py < pz) {
      p.y = h + r;
      if (g.vel.y < 0) g.vel.y = Math.abs(g.vel.y) * 0.35;
      g.vel.x *= 0.86;
      g.vel.z *= 0.86;
    } else if (px < pz) {
      p.x = o.x + Math.sign(dx || 1) * hw;
      g.vel.x *= -0.5;
      g.vel.z *= 0.82;
    } else {
      p.z = o.z + Math.sign(dz || 1) * hd;
      g.vel.z *= -0.5;
      g.vel.x *= 0.82;
    }
  }
}

function updateGrenades(dt) {
  for (let i = grenades.length - 1; i >= 0; i--) {
    const g = grenades[i];
    g.vel.y -= 22 * dt;

    const speed = g.vel.length();
    const steps = Math.max(1, Math.ceil(speed * dt / 0.22));
    const sub = dt / steps;
    for (let s = 0; s < steps; s++) {
      g.mesh.position.addScaledVector(g.vel, sub);
      collideGrenade(g);
    }

    if (g.mesh.position.y < 0.14) {
      g.mesh.position.y = 0.14;
      if (g.vel.y < 0) {
        g.vel.y *= -0.42;
        if (Math.abs(g.vel.y) < 1.2) g.vel.y = 0;
      }
      g.vel.x *= 0.82;
      g.vel.z *= 0.82;
    }

    g.mesh.rotation.x += g.spin.x * dt;
    g.mesh.rotation.z += g.spin.z * dt;

    g.timer -= dt;
    if (g.timer <= 0 || g.mesh.position.length() > 220) {
      explode(g.mesh.position.clone());
      scene.remove(g.mesh);
      grenades.splice(i, 1);
    }
  }
}

// ---------- 视线遮挡 ----------
const _ray = new THREE.Raycaster();
const _fromV = new THREE.Vector3();
const _dirV = new THREE.Vector3();

function isBlocked(ax, ay, az, bx, by, bz) {
  _fromV.set(ax, ay, az);
  _dirV.set(bx - ax, by - ay, bz - az);
  const dist = _dirV.length();
  if (dist < 0.001) return false;
  _dirV.divideScalar(dist);
  _ray.set(_fromV, _dirV);
  _ray.near = 0;
  _ray.far = dist;
  const hits = _ray.intersectObjects(buildingMeshes, false);
  return hits.length > 0;
}

// ---------- 爆炸 ----------
function explode(pos) {
  const light = new THREE.PointLight(0xffaa44, 40, 34, 2);
  light.position.copy(pos); light.position.y += 0.6;
  scene.add(light);

  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(1, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xffcc44, transparent: true, opacity: 1 })
  );
  ball.position.copy(pos);
  scene.add(ball);

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.6, 1.0, 40),
    new THREE.MeshBasicMaterial({
      color: 0xffe08a, transparent: true, opacity: 0.9,
      side: THREE.DoubleSide, depthWrite: false
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.copy(pos); ring.position.y = 0.12;
  scene.add(ring);

  const pGeo = new THREE.SphereGeometry(0.12, 5, 4);
  const pMat = new THREE.MeshBasicMaterial({ color: 0xffaa33 });
  const parts = [];
  for (let i = 0; i < 26; i++) {
    const p = new THREE.Mesh(pGeo, pMat);
    p.position.copy(pos);
    const v = new THREE.Vector3(
      (Math.random() - 0.5) * 2,
      Math.random() * 1.4,
      (Math.random() - 0.5) * 2
    ).normalize().multiplyScalar(8 + Math.random() * 16);
    v.y = Math.abs(v.y) + 4;
    scene.add(p);
    parts.push({ p, v });
  }

  let t = 0;
  addEffect(dt => {
    t += dt;
    const k = Math.min(t / 0.55, 1);

    ball.scale.setScalar(0.5 + k * 6.5);
    ball.material.opacity = 1 - k;
    ball.material.color.setHSL(0.11 - k * 0.09, 1, Math.max(0.25, 0.62 - k * 0.3));

    ring.scale.setScalar(1 + k * 15);
    ring.material.opacity = Math.max(0, 0.9 * (1 - k * 1.2));

    light.intensity = 40 * (1 - k) * (1 - k);

    for (const o of parts) {
      o.v.y -= 26 * dt;
      o.p.position.addScaledVector(o.v, dt);
      if (o.p.position.y < 0.1) { o.p.position.y = 0.1; o.v.y *= -0.35; o.v.x *= 0.7; o.v.z *= 0.7; }
      o.p.scale.setScalar(Math.max(0.01, 1 - k));
    }

    if (k >= 1) {
      scene.remove(ball); ball.geometry.dispose(); ball.material.dispose();
      scene.remove(ring); ring.geometry.dispose(); ring.material.dispose();
      scene.remove(light);
      for (const o of parts) scene.remove(o.p);
      return false;
    }
    return true;
  });

  scene.updateMatrixWorld(true);

  const d2 = player.pos.distanceTo(pos);
  shake = Math.max(shake, clamp(1.6 - d2 / 22, 0, 1.6));
  const flashEl = document.getElementById('flash');
  flashEl.style.transition = 'none';
  flashEl.style.opacity = clamp(0.5 - d2 / 40, 0, 0.5);
  setTimeout(() => {
    flashEl.style.transition = 'opacity .3s';
    flashEl.style.opacity = 0;
  }, 40);

  const ox = pos.x, oy = Math.max(pos.y, 0.4), oz = pos.z;

  const dp = player.pos.distanceTo(pos);
  if (dp < PLAYER_BOOM_RADIUS) {
    if (!isBlocked(ox, oy, oz, player.pos.x, 1.1, player.pos.z)) {
      const dmg = 90 * (1 - dp / PLAYER_BOOM_RADIUS) + 8;
      damagePlayer(dmg);
      if (gameIsOver) return;
    }
  }

  let hitAny = false;
  for (const t of teammates) {
    if (t.state === 'down') continue;
    const d = t.group.position.distanceTo(pos);
    if (d > TEAM_BOOM_RADIUS) continue;
    if (isBlocked(ox, oy, oz, t.group.position.x, 1.0, t.group.position.z)) continue;

    hitAny = true;
    const dmg = 220 * (1 - d / TEAM_BOOM_RADIUS);
    t.hit(dmg, pos);
  }

  if (hitAny) {
    comboCount++;
    comboTimer = 2.2;
    if (comboCount >= 2) showCombo(comboCount);
  }

  spawnFloater(pos, pick(['BOOM！', '轰——', '起飞咯！', '都给我飞！']), '#ff8833', 1.3);
}

function showCombo(n) {
  const el = document.getElementById('combo');
  el.textContent = `${n} 连炸！`;
  el.classList.add('show');
}

// ---------- 医疗包 ----------
const medkits = [];
const MEDKIT_COUNT = 8;
const MEDKIT_MIN = 3;
const MEDKIT_HEAL = 40;
const MEDKIT_PICK_RADIUS = 2.3;

let medkitSpawnTimer = 0;

const MEDKIT_GEO_BOX = new THREE.BoxGeometry(0.62, 0.42, 0.62);
const MEDKIT_GEO_BAR_A = new THREE.BoxGeometry(0.44, 0.05, 0.15);
const MEDKIT_GEO_BAR_B = new THREE.BoxGeometry(0.15, 0.05, 0.44);
const MEDKIT_MAT_WHITE = new THREE.MeshStandardMaterial({
  color: 0xf5f5f5, roughness: 0.55, emissive: 0x333333, emissiveIntensity: 0.25
});
const MEDKIT_MAT_RED = new THREE.MeshStandardMaterial({
  color: 0xe63946, roughness: 0.45, emissive: 0x550000, emissiveIntensity: 0.45
});

function makeMedkitMesh() {
  const g = new THREE.Group();
  const box = new THREE.Mesh(MEDKIT_GEO_BOX, MEDKIT_MAT_WHITE);
  box.position.y = 0.21;
  box.castShadow = true;
  g.add(box);

  const barA = new THREE.Mesh(MEDKIT_GEO_BAR_A, MEDKIT_MAT_RED);
  barA.position.y = 0.43;
  const barB = new THREE.Mesh(MEDKIT_GEO_BAR_B, MEDKIT_MAT_RED);
  barB.position.y = 0.43;
  g.add(barA, barB);
  return g;
}

function randomMedkitPos() {
  for (let i = 0; i < 120; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 8 + Math.random() * 40;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.hypot(x, z) < 6) continue;
    if (Math.hypot(x - player.pos.x, z - player.pos.z) < 4) continue;
    if (pointBlocked(x, z, 1.0)) continue;
    let tooClose = false;
    for (const mk of medkits) {
      if (Math.hypot(x - mk.mesh.position.x, z - mk.mesh.position.z) < 6) {
        tooClose = true; break;
      }
    }
    if (tooClose) continue;
    return [x, z];
  }
  return [12, 12];
}

function spawnMedkit() {
  if (gameIsOver) return;
  const [x, z] = randomMedkitPos();
  const mesh = makeMedkitMesh();
  mesh.position.set(x, 0.55, z);
  scene.add(mesh);
  medkits.push({ mesh, phase: Math.random() * Math.PI * 2 });
}

function updateMedkitSpawn(dt) {
  if (gameIsOver) return;
  if (medkits.length >= MEDKIT_COUNT) {
    medkitSpawnTimer = 0;
    return;
  }
  medkitSpawnTimer -= dt;
  if (medkitSpawnTimer > 0) return;

  spawnMedkit();

  if (medkits.length < MEDKIT_MIN) {
    medkitSpawnTimer = 0.9;
  } else {
    medkitSpawnTimer = 3.0;
  }
}

function updateMedkits(dt) {
  for (let i = medkits.length - 1; i >= 0; i--) {
    const mk = medkits[i];
    mk.mesh.rotation.y += dt * 1.8;
    mk.mesh.position.y = 0.55 + Math.sin(worldTime * 2.2 + mk.phase) * 0.14;

    const dx = player.pos.x - mk.mesh.position.x;
    const dz = player.pos.z - mk.mesh.position.z;
    if (dx * dx + dz * dz < MEDKIT_PICK_RADIUS * MEDKIT_PICK_RADIUS && playerHP < 100) {
      const before = playerHP;
      playerHP = Math.min(100, playerHP + MEDKIT_HEAL);
      updateHPUI();
      spawnFloater(mk.mesh.position.clone(), `+${Math.round(playerHP - before)} 生命`,
        '#4ade80', 1.0);
      notice('拾取医疗包 · 生命值 +' + MEDKIT_HEAL, 'heal');

      scene.remove(mk.mesh);
      medkits.splice(i, 1);
    }
  }
}

function makeLabel() {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 84;

  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false
  }));
  sp.scale.set(2.0, 0.66, 1);
  scene.add(sp);

}

class Teammate {
  constructor(name, x, z) {
    this.name = name;
    this.hp = 100;
    this.state = 'alive';
    this.dead = false;
    this.vel = new THREE.Vector3();
    this.angVel = new THREE.Vector3();
    this.target = new THREE.Vector3(x, 0, z);
    this.walkPhase = Math.random() * 6.28;
    this.speed = 1.3 + Math.random() * 1.6;
    this.fleeTimer = 0;
    this.sayCd = 0;
    this.lieTimer = 0;

    // 卡住检测
    this.stuckTimer = 0;
    this.lastPos = new THREE.Vector3(x, 0, z);

    this.group = new THREE.Group();
    this.group.position.set(x, 0, z);
    this.build();
    scene.add(this.group);

    this.label = makeLabel();
    this.refreshLabel();
    this.newTarget();
  }

  build() {
    const g = this.group;

    const legGeo = new THREE.CylinderGeometry(0.09, 0.08, 0.74, 6);
    legGeo.translate(0, -0.37, 0);
    this.legL = new THREE.Mesh(legGeo, MAT.legs);
    this.legL.position.set(-0.13, 0.76, 0);
    this.legL.castShadow = true;
    this.legR = new THREE.Mesh(legGeo, MAT.legs);
    this.legR.position.set(0.13, 0.76, 0);
    this.legR.castShadow = true;

    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.2, 0.72, 8), MAT.body);
    torso.position.y = 1.12;
    torso.castShadow = true;

    const vest = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.44, 0.36), MAT.vest);
    vest.position.y = 1.16;
    vest.castShadow = true;

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.185, 12, 10), MAT.skin);
    head.position.y = 1.62;
    head.castShadow = true;

    const helmet = new THREE.Mesh(
      new THREE.SphereGeometry(0.215, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.58),
      MAT.helmet
    );
    helmet.position.y = 1.63;
    helmet.castShadow = true;

    const armGeo = new THREE.CylinderGeometry(0.07, 0.06, 0.62, 6);
    armGeo.translate(0, -0.31, 0);
    this.armL = new THREE.Mesh(armGeo, MAT.arm);
    this.armL.position.set(-0.31, 1.42, 0);
    this.armL.castShadow = true;
    this.armR = new THREE.Mesh(armGeo, MAT.arm);
    this.armR.position.set(0.31, 1.42, 0);
    this.armR.castShadow = true;

    g.add(this.legL, this.legR, torso, vest, head, helmet, this.armL, this.armR);
  }

  refreshLabel() {
    const { ctx, cv, tex } = this.label;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px "Microsoft YaHei",sans-serif';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(0,0,0,.8)';
    ctx.fillStyle = this.state === 'down' ? '#ff6666' : '#ffffff';
    ctx.strokeText(this.name, cv.width / 2, 30);
    ctx.fillText(this.name, cv.width / 2, 30);

    const W = 150, H = 11, X = (cv.width - W) / 2, Y = 46;
    ctx.fillStyle = 'rgba(0,0,0,.62)';
    ctx.fillRect(X, Y, W, H);
    const ratio = clamp(this.hp / 100, 0, 1);
    ctx.fillStyle = ratio > 0.4 ? '#4ade80' : '#ff4d4d';
    ctx.fillRect(X, Y, W * ratio, H);
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(X, Y, W, H);

    tex.needsUpdate = true;
  }

  // 随机漫游目标：保证目标点可站立且从当前位置能直达
  newTarget() {
    const px = this.group.position.x;
    const pz = this.group.position.z;

    // 优先：目标点合法 + 路径通畅
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 4 + Math.random() * 26;
      const tx = clamp(px + Math.cos(a) * r, -45, 45);
      const tz = clamp(pz + Math.sin(a) * r, -45, 45);
      if (pointBlocked(tx, tz, 0.9)) continue;
      if (segmentBlocked(px, pz, tx, tz, 0.4)) continue;
      this.target.set(tx, 0, tz);
      return;
    }

    // 次选：只保证目标点合法（允许绕路过去）
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 3 + Math.random() * 16;
      const tx = clamp(px + Math.cos(a) * r, -45, 45);
      const tz = clamp(pz + Math.sin(a) * r, -45, 45);
      if (pointBlocked(tx, tz, 0.9)) continue;
      this.target.set(tx, 0, tz);
      return;
    }

    // 兜底：小范围随机偏移
    this.target.set(
      clamp(px + (Math.random() - 0.5) * 10, -45, 45),
      0,
      clamp(pz + (Math.random() - 0.5) * 10, -45, 45)
    );
  }

  // 逃跑目标：远离爆炸点，同样做路径检查
  flee(from) {
    if (this.state !== 'alive') return;
    const dir = new THREE.Vector3().subVectors(this.group.position, from);
    dir.y = 0;
    if (dir.lengthSq() < 0.01) dir.set(Math.random() - 0.5, 0, Math.random() - 0.5);
    dir.normalize();

    const px = this.group.position.x;
    const pz = this.group.position.z;

    for (let i = 0; i < 12; i++) {
      const dist = 16 + Math.random() * 12;
      const spread = (Math.random() - 0.5) * 10;
      const tx = clamp(px + dir.x * dist + dir.z * spread, -48, 48);
      const tz = clamp(pz + dir.z * dist - dir.x * spread, -48, 48);
      if (pointBlocked(tx, tz, 0.9)) continue;
      if (segmentBlocked(px, pz, tx, tz, 0.4)) continue;
      this.target.set(tx, 0, tz);
      this.fleeTimer = 2.6;
      this.stuckTimer = 0;
      return;
    }

    this.fleeTimer = 2.6;
    this.stuckTimer = 0;
    this.newTarget();
  }

  say(text, color) {
    if (this.sayCd > 0) return;
    this.sayCd = 1.4;
    const p = this.group.position.clone();
    p.y = 1.9;
    spawnFloater(p, text, color || '#ffffff', 0.85);
  }

  hit(dmg, fromPos) {
    if (this.state === 'down') return;
    this.hp -= dmg;
    this.refreshLabel();

    if (this.hp <= 0) {
      this.state = 'flying';
      const dir = new THREE.Vector3().subVectors(this.group.position, fromPos);
      dir.y = 0;
      if (dir.lengthSq() < 0.01) dir.set(Math.random() - 0.5, 0, Math.random() - 0.5);
      dir.normalize();
      const f = 11 + Math.random() * 9;
      this.vel.set(dir.x * f, 9 + Math.random() * 7, dir.z * f);
      this.angVel.set(
        (Math.random() - 0.5) * 16,
        (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 16
      );
      this.sayCd = 0;
      this.say(pick(LINES), '#ff5555');
      koCount++;
      document.getElementById('kills').textContent = koCount;
      notice(`你炸飞了 ${this.name}`, 'kill');
    } else {
      const dir = new THREE.Vector3().subVectors(this.group.position, fromPos).setY(0).normalize();
      this.group.position.addScaledVector(dir, 1.2);
      resolveCollision(this.group.position, 0.35);
      this.say(pick(LINES), '#ffbb44');
    }
  }

  update(dt) {
    if (this.sayCd > 0) this.sayCd -= dt;

    if (this.state === 'alive') {
      const toT = new THREE.Vector3().subVectors(this.target, this.group.position);
      toT.y = 0;
      const dist = toT.length();

      if (dist < 1.2) this.newTarget();

      const spd = this.fleeTimer > 0 ? 7.2 : this.speed;
      if (this.fleeTimer > 0) this.fleeTimer -= dt;

      if (dist > 0.01) {
        const dir = toT.normalize();

        // 主动避障：探测前方，找一条通畅的路
        const steer = steerAround(this.group.position, dir, 0.45, 2.0);

        this.group.position.addScaledVector(steer, spd * dt);
        // 兜底：不允许站进障碍里
        resolveCollision(this.group.position, 0.35);

        const targetYaw = Math.atan2(steer.x, steer.z);
        let dy = targetYaw - this.group.rotation.y;
        while (dy > Math.PI) dy -= Math.PI * 2;
        while (dy < -Math.PI) dy += Math.PI * 2;
        this.group.rotation.y += dy * Math.min(1, dt * 8);
      }

      this.walkPhase += dt * spd * 2.6;
      const sw = Math.sin(this.walkPhase) * (this.fleeTimer > 0 ? 0.85 : 0.55);
      this.legL.rotation.x = sw;
      this.legR.rotation.x = -sw;
      this.armL.rotation.x = -sw * 0.8;
      this.armR.rotation.x = sw * 0.8;

      this.group.position.x = clamp(this.group.position.x, -52, 52);
      this.group.position.z = clamp(this.group.position.z, -52, 52);

      // 卡住检测：几乎没动就重新选目标
      const movedSq = this.group.position.distanceToSquared(this.lastPos);
      if (movedSq < 0.0001) {
        this.stuckTimer += dt;
        if (this.stuckTimer > 1.0) {
          this.newTarget();
          this.fleeTimer = 0;
          this.stuckTimer = 0;
        }
      } else {
        this.stuckTimer = 0;
      }
      this.lastPos.copy(this.group.position);
    }
    else if (this.state === 'flying') {
      this.vel.y -= 26 * dt;
      this.group.position.addScaledVector(this.vel, dt);
      this.group.rotation.x += this.angVel.x * dt;
      this.group.rotation.y += this.angVel.y * dt;
      this.group.rotation.z += this.angVel.z * dt;

      if (this.group.position.y <= 0) {
        this.group.position.y = 0;
        this.vel.y *= -0.32;
        this.vel.x *= 0.62;
        this.vel.z *= 0.62;
        this.angVel.multiplyScalar(0.55);

        if (Math.abs(this.vel.y) < 1.6 && Math.hypot(this.vel.x, this.vel.z) < 2.2) {
          this.state = 'down';
          this.lieTimer = 0;
          this.refreshLabel();
        }
      }
    }
    else if (this.state === 'down') {
      this.lieTimer += dt;
      const k = Math.min(1, this.lieTimer * 4);
      this.group.rotation.z += (Math.PI / 2 - this.group.rotation.z) * k * 0.3;
      this.group.position.y += (0.26 - this.group.position.y) * k * 0.3;

      if (this.lieTimer > 10) this.dead = true;
    }

    const lp = this.group.position;
    this.label.sp.position.set(lp.x, lp.y + 2.25, lp.z);
  }

  dispose() {
    scene.remove(this.group);
    scene.remove(this.label.sp);
    this.label.tex.dispose();
    this.label.sp.material.dispose();
  }
}

// ---------- 队友生成 / 补充 ----------
const teammates = [];

const INITIAL_TEAM = 12;
const TARGET_ALIVE = 12;
const REFILL_THRESHOLD = 3;

let gameGen = 0;

function randomSpawnPos() {
  for (let i = 0; i < 80; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 9 + Math.random() * 36;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.hypot(x, z) < 9) continue;
    if (Math.hypot(x - player.pos.x, z - player.pos.z) < 9) continue;
    if (pointBlocked(x, z, 1.2)) continue;
    return [x, z];
  }
  return [10, 10];
}

function spawnTeammate(name, announce) {
  const [x, z] = randomSpawnPos();
  const t = new Teammate(name, x, z);
  teammates.push(t);
  if (announce) notice(`${name} 加入了游戏`, 'join');
  return t;
}

let pendingSpawns = [];
let spawnTimer = 0;
let refillCheckTimer = 0;

function countAlive() {
  let n = 0;
  for (const t of teammates) if (t.state !== 'down') n++;
  return n;
}

function updateRefill(dt) {
  if (pendingSpawns.length > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = 0.32;
      spawnTeammate(pendingSpawns.pop(), true);
    }
    return;
  }

  refillCheckTimer -= dt;
  if (refillCheckTimer > 0) return;
  refillCheckTimer = 0.8;

  const alive = countAlive();
  if (alive <= REFILL_THRESHOLD) {
    const need = TARGET_ALIVE - alive;
    for (let i = 0; i < need; i++) pendingSpawns.push(nextName());
  }
}

// ---------- 碰撞 ----------
function resolveCollision(pos, radius) {
  for (const o of obstacles) {
    const hw = o.w / 2 + radius;
    const hd = o.d / 2 + radius;
    const dx = pos.x - o.x;
    const dz = pos.z - o.z;
    if (Math.abs(dx) < hw && Math.abs(dz) < hd) {
      const px = hw - Math.abs(dx);
      const pz = hd - Math.abs(dz);
      if (px < pz) pos.x = o.x + Math.sign(dx || 1) * hw;
      else pos.z = o.z + Math.sign(dz || 1) * hd;
    }
  }
}

// ---------- 玩家更新 ----------
function updatePlayer(dt) {
  const f = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const r = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

  const wish = new THREE.Vector3();
  if (keys['w'] || keys['arrowup']) wish.add(f);
  if (keys['s'] || keys['arrowdown']) wish.sub(f);
  if (keys['d'] || keys['arrowright']) wish.add(r);
  if (keys['a'] || keys['arrowleft']) wish.sub(r);

  if (Math.abs(joyX) > 0.08 || Math.abs(joyUp) > 0.08) {
    wish.addScaledVector(f, joyUp);
    wish.addScaledVector(r, joyX);
  }

  if (wish.lengthSq() > 0) wish.normalize();

  const speed = keys['shift'] ? 12.5 : 7.2;
  wish.multiplyScalar(speed);
  player.vel.lerp(wish, 1 - Math.pow(0.0008, dt));

  const move = player.vel.clone().multiplyScalar(dt);
  const moveLen = move.length();
  const steps = Math.max(1, Math.ceil(moveLen / 0.2));
  for (let s = 0; s < steps; s++) {
    player.pos.addScaledVector(player.vel, dt / steps);
    resolveCollision(player.pos, 0.45);
  }

  player.pos.x = clamp(player.pos.x, -95, 95);
  player.pos.z = clamp(player.pos.z, -95, 95);
  player.pos.y = 1.7;

  const spd2d = Math.hypot(player.vel.x, player.vel.z);
  player.bob += dt * spd2d * 1.7;
  const bobY = Math.sin(player.bob) * Math.min(spd2d / 7.2, 1) * 0.055;

  if (throwCooldown > 0) throwCooldown -= dt;

  const sx = (Math.random() - 0.5) * shake;
  const sy = (Math.random() - 0.5) * shake;
  const sz = (Math.random() - 0.5) * shake;
  camera.position.set(player.pos.x + sx, player.pos.y + bobY + sy, player.pos.z + sz);
  camera.rotation.set(player.pitch, player.yaw, 0);

  shake *= Math.exp(-dt * 7);
  if (shake < 0.001) shake = 0;

  const cdEl = document.getElementById('cd');
  cdEl.style.transform = `scaleX(${clamp(1 - throwCooldown / COOLDOWN, 0, 1)})`;

  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) {
      comboCount = 0;
      document.getElementById('combo').classList.remove('show');
    }
  }
}

// ---------- 音乐 ----------
const bgm = document.getElementById('bgm');
bgm.volume = 0.42;
let musicOn = true;
let musicStarted = false;

function toggleMusic() {
  musicOn = !musicOn;
  if (!musicOn) bgm.pause();
  else if (musicStarted) bgm.play().catch(() => {});
}

// ---------- 开始 / 暂停 / Game Over ----------
const overlay = document.getElementById('overlay');
const gameoverEl = document.getElementById('gameover');
const goStatsEl = document.getElementById('goStats');

function setStickUI(mode) {
  if (mode === 'stick') {
    joystickEl.style.display = 'block';
    throwBtn.style.display = 'flex';
  } else {
    joystickEl.style.display = 'none';
    throwBtn.style.display = 'none';
  }
}

function startGame(mode) {
  inputMode = mode;
  paused = false;
  gameIsOver = false;
  overlay.classList.add('hide');
  gameoverEl.classList.remove('show');
  setStickUI(mode);

  if (mode === 'kbm') {
    renderer.domElement.requestPointerLock();
  }

  if (!musicStarted) {
    bgm.play().then(() => { musicStarted = true; }).catch(() => {
      console.warn('music.mp3 未找到或无法播放，请把 music.mp3 放到同目录。');
    });
  }
}

bindTap(document.getElementById('startKbm'), () => startGame('kbm'));
bindTap(document.getElementById('startStick'), () => startGame('stick'));

document.addEventListener('pointerlockchange', () => {
  if (inputMode !== 'kbm') return;
  if (gameIsOver) return;
  if (document.pointerLockElement === renderer.domElement) {
    paused = false;
    overlay.classList.add('hide');
  } else {
    paused = true;
    overlay.classList.remove('hide');
    overlay.querySelector('h1').textContent = '已 暂 停';
    document.getElementById('startKbm').textContent = '继 续 游 戏';
  }
});

// ---------- Game Over ----------
function gameOver() {
  if (gameIsOver) return;
  gameIsOver = true;
  paused = true;
  shake = 0;

  if (inputMode === 'kbm' && document.pointerLockElement) {
    document.exitPointerLock();
  }
  setStickUI('none');

  goStatsEl.innerHTML =
    `本局炸飞队友 <b>${koCount}</b> 名<br>` +
    `投出 <b>${throwCount}</b> 颗手雷`;

  gameoverEl.classList.add('show');
}

// ---------- 重置 / 重开 ----------
function resetGame() {
  gameGen++;

  for (const t of teammates) t.dispose();
  teammates.length = 0;

  for (const g of grenades) scene.remove(g.mesh);
  grenades.length = 0;

  for (const mk of medkits) scene.remove(mk.mesh);
  medkits.length = 0;

  effects.length = 0;
  for (const fl of floaters) {
    scene.remove(fl.sp);
    fl.sp.material.map.dispose();
    fl.sp.material.dispose();
  }
  floaters.length = 0;

  noticesEl.innerHTML = '';

  player.pos.set(0, 1.7, 0);
  player.vel.set(0, 0, 0);
  player.yaw = 0;
  player.pitch = 0;
  player.bob = 0;

  playerHP = 100;
  updateHPUI();
  hurtAlpha = 0;
  hurtEl.style.opacity = 0;
  shake = 0;

  koCount = 0;
  throwCount = 0;
  throwCooldown = 0;
  comboCount = 0;
  comboTimer = 0;
  document.getElementById('kills').textContent = 0;
  document.getElementById('throws').textContent = 0;
  document.getElementById('combo').classList.remove('show');
  document.getElementById('cd').style.transform = 'scaleX(1)';

  pendingSpawns = [];
  spawnTimer = 0;
  refillCheckTimer = 0;
  medkitSpawnTimer = 0;

  for (let i = 0; i < INITIAL_TEAM; i++) spawnTeammate(nextName(), false);
  for (let i = 0; i < MEDKIT_COUNT; i++) spawnMedkit();

  document.getElementById('alive').textContent = '存活队友：' + countAlive();

  gameoverEl.classList.remove('show');
  gameIsOver = false;
  paused = false;
  setStickUI(inputMode);

  if (inputMode === 'kbm') {
    renderer.domElement.requestPointerLock();
  }
}

bindTap(document.getElementById('restartBtn'), () => resetGame());

// ---------- 初始生成 ----------
for (let i = 0; i < INITIAL_TEAM; i++) spawnTeammate(nextName(), false);
for (let i = 0; i < MEDKIT_COUNT; i++) spawnMedkit();

// ---------- 主循环 ----------
const clock = new THREE.Clock();
const aliveEl = document.getElementById('alive');

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!paused && !gameIsOver) {
    worldTime += dt;
    updatePlayer(dt);
    updateGrenades(dt);
    updateMedkits(dt);
    updateMedkitSpawn(dt);

    for (let i = teammates.length - 1; i >= 0; i--) {
      const t = teammates[i];
      t.update(dt);
      if (t.dead) {
        t.dispose();
        teammates.splice(i, 1);
      }
    }

    updateRefill(dt);
    aliveEl.textContent = '存活队友：' + countAlive();
  } else {
    camera.position.copy(player.pos);
    camera.rotation.set(player.pitch, player.yaw, 0);
  }

  if (hurtAlpha > 0) {
    hurtAlpha = Math.max(0, hurtAlpha - dt * 2.2);
    hurtEl.style.opacity = hurtAlpha.toFixed(3);
  }

  for (let i = effects.length - 1; i >= 0; i--) {
    if (!effects[i](dt)) effects.splice(i, 1);
  }

  for (let i = floaters.length - 1; i >= 0; i--) {
    const fl = floaters[i];
    fl.life -= dt;
    fl.sp.position.y += 2.3 * dt;
    fl.sp.material.opacity = Math.min(1, fl.life / 0.45);
    if (fl.life <= 0) {
      scene.remove(fl.sp);
      fl.sp.material.map.dispose();
      fl.sp.material.dispose();
      floaters.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
}

animate();

// ---------- 自适应 ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
