<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>dsPinball</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            /* 禁止移动端长按选中文字 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            /* 禁止移动端点击高亮 */
            -webkit-tap-highlight-color: transparent;
        }
        .game-container {
            margin-top: 20px;
            padding: 0 10px;
        }
        canvas {
            background-color: #ffffff;
            border: 2px solid #333;
            display: block;
            margin: 0 auto;
            cursor: none;
            /* 禁止触摸时滚动/缩放页面 */
            touch-action: none;
            -ms-touch-action: none;
            /* 自适应宽度：最大不超过画布原始宽度，小屏时等比缩小 */
            max-width: 100%;
            height: auto;
        }
        .info {
            margin-top: 10px;
            font-size: 18px;
            color: #333;
        }
        .info span {
            font-weight: bold;
            color: #d00;
        }
        .control {
            margin-top: 10px;
            font-size: 16px;
            color: #333;
        }
        .control input {
            width: 60px;
            padding: 6px;
            font-size: 16px;
            text-align: center;
            border: 1px solid #999;
            border-radius: 4px;
        }
        .control button {
            padding: 6px 14px;
            font-size: 16px;
            margin-left: 8px;
            margin-top: 6px;
            cursor: pointer;
            border: 1px solid #999;
            background-color: #fafafa;
            border-radius: 4px;
            /* 移动端加大点击区域 */
            min-width: 60px;
        }
        .control button:hover {
            background-color: #eee;
        }
        .hint {
            font-size: 13px;
            color: #888;
            display: block;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="400">您的浏览器不支持Canvas，请升级到IE9或更高版本。</canvas>
        <div class="info">
            得分: <span id="scoreDisplay">0</span> &nbsp;|&nbsp; 生命: <span id="livesDisplay">3</span>
        </div>
        <div class="control">
            球速: <input type="text" id="speedInput" value="3" />
            <button id="applySpeedBtn">应用</button>
            <button id="pauseBtn">暂停</button>
            <span class="hint">电脑：移动鼠标控制挡板，空格暂停 | 手机：手指滑动控制挡板</span>
        </div>
    </div>

    <script type="text/javascript">
        // ===== 游戏配置 =====
        var CANVAS_WIDTH = 600;
        var CANVAS_HEIGHT = 400;
        var PADDLE_WIDTH = 100;
        var PADDLE_HEIGHT = 15;
        var PADDLE_Y = CANVAS_HEIGHT - 30;
        var BALL_RADIUS = 8;
        var DEFAULT_SPEED = 3;
        var INIT_LIVES = 3;

        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');
        var scoreDisplay = document.getElementById('scoreDisplay');
        var livesDisplay = document.getElementById('livesDisplay');
        var speedInput = document.getElementById('speedInput');
        var applySpeedBtn = document.getElementById('applySpeedBtn');
        var pauseBtn = document.getElementById('pauseBtn');

        // ===== 游戏状态 =====
        var paddleX = (CANVAS_WIDTH - PADDLE_WIDTH) / 2;
        var ballX = CANVAS_WIDTH / 2;
        var ballY = CANVAS_HEIGHT / 2;
        var ballVX = 2;
        var ballVY = -DEFAULT_SPEED;
        var baseSpeed = DEFAULT_SPEED;
        var score = 0;
        var lives = INIT_LIVES;
        var gameOver = false;
        var paused = false;

        // ===== 事件绑定（兼容IE8）=====
        function addEvent(element, eventName, handler) {
            if (element.addEventListener) {
                element.addEventListener(eventName, handler, false);
            } else if (element.attachEvent) {
                element.attachEvent('on' + eventName, handler);
            } else {
                element['on' + eventName] = handler;
            }
        }

        // ===== 阻止默认行为（兼容IE8）=====
        function preventDefault(e) {
            if (e.preventDefault) {
                e.preventDefault();
            } else {
                e.returnValue = false;
            }
        }

        // ===== 把屏幕坐标换算成画布内部坐标 =====
        // 因为画布可能被CSS缩放（移动端自适应），需要按比例换算
        function getCanvasX(clientX, pageX) {
            var rect = canvas.getBoundingClientRect();
            var rawX;

            if (typeof pageX !== 'undefined' && pageX !== null) {
                // 用 pageX 需要加上滚动偏移
                var scrollLeft = document.documentElement.scrollLeft || document.body.scrollLeft;
                rawX = pageX - scrollLeft - rect.left;
            } else {
                rawX = clientX - rect.left;
            }

            // 如果画布显示宽度和内部宽度不同，按比例缩放
            if (rect.width && rect.width !== CANVAS_WIDTH) {
                rawX = rawX * (CANVAS_WIDTH / rect.width);
            }

            return rawX;
        }

        // ===== 统一的移动挡板逻辑 =====
        function movePaddleTo(canvasX) {
            paddleX = canvasX - PADDLE_WIDTH / 2;
            if (paddleX < 0) paddleX = 0;
            if (paddleX > CANVAS_WIDTH - PADDLE_WIDTH) paddleX = CANVAS_WIDTH - PADDLE_WIDTH;
        }

        // ===== 鼠标控制（电脑）=====
        function handleMouseMove(e) {
            if (gameOver || paused) return;
            var mouseX = getCanvasX(e.clientX, e.pageX);
            movePaddleTo(mouseX);
        }

        // ===== 触摸控制（手机/平板）=====
        function handleTouchMove(e) {
            if (gameOver || paused) return;
            preventDefault(e);   // 阻止页面滚动

            if (e.touches && e.touches.length > 0) {
                var touch = e.touches[0];
                var touchX = getCanvasX(touch.clientX, touch.pageX);
                movePaddleTo(touchX);
            }
        }

        // ===== 生成随机初始位置和方向 =====
        function resetBallRandom() {
            ballX = BALL_RADIUS + Math.random() * (CANVAS_WIDTH - 2 * BALL_RADIUS);
            ballY = BALL_RADIUS + Math.random() * (CANVAS_HEIGHT / 2);

            var dirX = Math.random() > 0.5 ? 1 : -1;
            ballVX = dirX * baseSpeed * 0.6;

            var dirY = Math.random() > 0.5 ? 1 : -1;
            ballVY = dirY * baseSpeed;

            if (ballY + BALL_RADIUS > PADDLE_Y - 30 && ballVY > 0) {
                ballVY = -ballVY;
            }
        }

        // ===== 应用速度 =====
        function applySpeed() {
            var newSpeed = parseFloat(speedInput.value);
            if (isNaN(newSpeed) || newSpeed <= 0) {
                alert('请输入大于0的数字');
                return;
            }

            if (!gameOver) {
                var currentSpeed = Math.sqrt(ballVX * ballVX + ballVY * ballVY);
                if (currentSpeed > 0) {
                    var ratio = newSpeed / currentSpeed;
                    ballVX *= ratio;
                    ballVY *= ratio;
                } else {
                    ballVY = -newSpeed;
                }
            }

            baseSpeed = newSpeed;
            speedInput.value = newSpeed;
        }

        // ===== 暂停/继续 =====
        function togglePause() {
            if (gameOver) return;
            paused = !paused;
            pauseBtn.innerHTML = paused ? '继续' : '暂停';
        }

        // ===== 更新逻辑 =====
        function updateGame() {
            if (gameOver || paused) return;

            ballX += ballVX;
            ballY += ballVY;

            // 左右墙壁反弹
            if (ballX - BALL_RADIUS < 0) {
                ballX = BALL_RADIUS;
                ballVX = -ballVX;
            }
            if (ballX + BALL_RADIUS > CANVAS_WIDTH) {
                ballX = CANVAS_WIDTH - BALL_RADIUS;
                ballVX = -ballVX;
            }

            // 顶部反弹
            if (ballY - BALL_RADIUS < 0) {
                ballY = BALL_RADIUS;
                ballVY = -ballVY;
            }

            // 与挡板碰撞
            var ballBottom = ballY + BALL_RADIUS;
            if (ballVY > 0 &&
                ballBottom >= PADDLE_Y &&
                ballBottom <= PADDLE_Y + PADDLE_HEIGHT + ballVY &&
                ballX + BALL_RADIUS > paddleX &&
                ballX - BALL_RADIUS < paddleX + PADDLE_WIDTH) {

                ballY = PADDLE_Y - BALL_RADIUS;
                ballVY = -ballVY;

                var hitPos = (ballX - paddleX) / PADDLE_WIDTH;
                ballVX = (hitPos - 0.5) * baseSpeed * 2;

                var currentSpeed = Math.sqrt(ballVX * ballVX + ballVY * ballVY);
                if (currentSpeed > 0.001) {
                    var ratio = baseSpeed / currentSpeed;
                    ballVX *= ratio;
                    ballVY *= ratio;
                }

                score += 10;
                scoreDisplay.innerHTML = score;
            }

            // 漏接判断
            if (ballY - BALL_RADIUS > CANVAS_HEIGHT) {
                lives--;
                livesDisplay.innerHTML = lives;
                if (lives <= 0) {
                    gameOver = true;
                } else {
                    resetBallRandom();
                }
            }
        }

        // ===== 绘制 =====
        function drawGame() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 挡板
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(paddleX, PADDLE_Y, PADDLE_WIDTH, PADDLE_HEIGHT);

            // 球
            ctx.beginPath();
            ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2, true);
            ctx.fillStyle = '#e74c3c';
            ctx.fill();
            ctx.closePath();

            // 暂停提示
            if (paused && !gameOver) {
                ctx.font = '30px Arial';
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.textAlign = 'center';
                ctx.fillText('已暂停', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
                ctx.font = '16px Arial';
                ctx.fillText('按空格或点击"继续"恢复', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 35);
            }

            // 游戏结束
            if (gameOver) {
                ctx.font = '30px Arial';
                ctx.fillStyle = '#000000';
                ctx.textAlign = 'center';
                ctx.fillText('游戏结束', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 20);
                ctx.font = '20px Arial';
                ctx.fillText('最终得分: ' + score, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 20);
                ctx.fillText('刷新页面重新开始', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 60);
            }
        }

        // ===== 主循环 =====
        function gameLoop() {
            updateGame();
            drawGame();
            setTimeout(gameLoop, 1000 / 60);
        }

        // ===== 键盘事件（空格暂停）=====
        function handleKeyDown(e) {
            var key = e.keyCode || e.which;
            if (key === 32) {
                preventDefault(e);
                togglePause();
            }
        }

        function init() {
            // 电脑：鼠标移动
            addEvent(document, 'mousemove', handleMouseMove);

            // 手机：触摸滑动（绑定在canvas上，避免影响页面其他区域）
            addEvent(canvas, 'touchstart', handleTouchMove);
            addEvent(canvas, 'touchmove', handleTouchMove);

            // 键盘
            addEvent(document, 'keydown', handleKeyDown);

            // 按钮
            addEvent(applySpeedBtn, 'click', applySpeed);
            addEvent(pauseBtn, 'click', togglePause);

            // 速度输入框回车
            addEvent(speedInput, 'keydown', function(e) {
                var key = e.keyCode || e.which;
                if (key === 13) {
                    applySpeed();
                }
            });

            scoreDisplay.innerHTML = score;
            livesDisplay.innerHTML = lives;
            speedInput.value = baseSpeed;

            resetBallRandom();
            gameLoop();
        }

        addEvent(window, 'load', init);
    </script>
</body>
</html>
