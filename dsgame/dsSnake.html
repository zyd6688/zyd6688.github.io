<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        h1 {
            color: #333;
            font-size: 16px;
            margin: 2px 0 4px;
        }
        .game-container {
            display: inline-block;
            background-color: #fff;
            padding: 6px;
            border: 2px solid #999;
            border-radius: 6px;
            max-width: 100%;
        }
        canvas {
            background-color: #e0e0e0;
            display: block;
            margin: 0 auto;
            border: 1px solid #666;
            width: 100%;
            height: auto;
            max-width: 320px;   /* 限制最大宽度，小屏时自适应 */
            -webkit-touch-callout: none;
        }
        .info {
            margin-top: 4px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        .score {
            color: #d00;
        }
        .speed-area {
            margin-top: 4px;
            font-size: 12px;
            color: #333;
        }
        .speed-area label {
            margin-right: 4px;
        }
        .speed-area input {
            width: 42px;
            padding: 2px 4px;
            font-size: 12px;
            text-align: center;
            border: 1px solid #999;
            border-radius: 3px;
        }
        .speed-area span {
            font-size: 11px;
            color: #666;
            margin-left: 2px;
        }
        .btn-group {
            margin-top: 4px;
        }
        button {
            padding: 5px 12px;
            font-size: 13px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
            margin: 0 2px;
        }
        button:active {
            background-color: #3e8e41;
        }
        #pauseBtn {
            background-color: #ff9800;
        }
        #pauseBtn:active {
            background-color: #cc7a00;
        }
        .note {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        /* 方向按钮 */
        .mobile-controls {
            margin-top: 6px;
            display: block;
        }
        .dpad {
            display: inline-block;
            position: relative;
            width: 130px;
            height: 130px;
        }
        .dpad-btn {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #4CAF50;
            border-radius: 6px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            line-height: 40px;
            text-align: center;
            box-shadow: 0 2px 3px rgba(0,0,0,0.2);
        }
        .dpad-btn:active {
            background-color: #3e8e41;
            box-shadow: 0 1px 1px rgba(0,0,0,0.2);
        }
        .dpad-up {
            top: 0;
            left: 45px;
        }
        .dpad-down {
            bottom: 0;
            left: 45px;
        }
        .dpad-left {
            top: 45px;
            left: 0;
        }
        .dpad-right {
            top: 45px;
            right: 0;
        }
        /* 针对非常小的屏幕进一步缩小 */
        @media screen and (max-width: 380px) {
            h1 { font-size: 14px; margin: 1px 0 3px; }
            .game-container { padding: 4px; }
            canvas { max-width: 280px; }
            .dpad { width: 110px; height: 110px; }
            .dpad-btn { width: 34px; height: 34px; line-height: 34px; font-size: 16px; }
            .dpad-up, .dpad-down { left: 38px; }
            .dpad-left, .dpad-right { top: 38px; }
            button { padding: 4px 10px; font-size: 12px; }
            .info { font-size: 13px; }
        }
        @media screen and (max-width: 340px) {
            canvas { max-width: 240px; }
            .dpad { width: 96px; height: 96px; }
            .dpad-btn { width: 30px; height: 30px; line-height: 30px; font-size: 14px; }
            .dpad-up, .dpad-down { left: 33px; }
            .dpad-left, .dpad-right { top: 33px; }
        }
    </style>
</head>
<body>
    <h1>🐍 贪吃蛇</h1>
    <div class="game-container">
        <!-- 画布尺寸保持 400x400 逻辑像素，通过 CSS 缩小显示 -->
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="info">
            得分: <span id="scoreDisplay" class="score">0</span>
        </div>
        <div class="speed-area">
            <label>速度:</label>
            <input type="text" id="speedInput" value="180" />
            <span>ms/步</span>
        </div>
        <div class="btn-group">
            <button id="pauseBtn">暂停</button>
            <button id="restartBtn">重新开始</button>
        </div>
        <div class="mobile-controls">
            <div class="dpad">
                <div class="dpad-btn dpad-up" data-dir="up">▲</div>
                <div class="dpad-btn dpad-down" data-dir="down">▼</div>
                <div class="dpad-btn dpad-left" data-dir="left">◀</div>
                <div class="dpad-btn dpad-right" data-dir="right">▶</div>
            </div>
        </div>
        <div class="note">键盘方向键 或 触屏按钮 控制</div>
    </div>

    <script type="text/javascript">
        // ---------- 兼容 IE 的贪吃蛇（小屏优化版） ----------
        var GRID_SIZE = 20;
        var COLS = 20;
        var ROWS = 20;
        var CANVAS_WIDTH = GRID_SIZE * COLS;   // 400
        var CANVAS_HEIGHT = GRID_SIZE * ROWS;  // 400

        var MIN_SPEED = 10;
        var MAX_SPEED = 1000;
        var DEFAULT_SPEED = 180;

        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');
        var scoreSpan = document.getElementById('scoreDisplay');
        var pauseBtn = document.getElementById('pauseBtn');
        var speedInput = document.getElementById('speedInput');

        var snake = [];
        var food = { x: 0, y: 0 };
        var direction = 'right';
        var nextDirection = 'right';
        var score = 0;
        var gameOver = false;
        var isPaused = false;
        var gameLoopInterval = null;
        var speed = DEFAULT_SPEED;

        // ---------- 速度控制 ----------
        function applySpeedFromInput() {
            var val = parseInt(speedInput.value, 10);
            if (isNaN(val)) val = DEFAULT_SPEED;
            if (val < MIN_SPEED) val = MIN_SPEED;
            if (val > MAX_SPEED) val = MAX_SPEED;
            speedInput.value = val;
            speed = val;

            if (!gameOver && !isPaused) {
                if (gameLoopInterval) clearInterval(gameLoopInterval);
                gameLoopInterval = setInterval(gameTick, speed);
            }
        }

        if (speedInput.addEventListener) {
            speedInput.addEventListener('change', applySpeedFromInput, false);
            speedInput.addEventListener('blur', applySpeedFromInput, false);
        } else if (speedInput.attachEvent) {
            speedInput.attachEvent('onchange', applySpeedFromInput);
            speedInput.attachEvent('onblur', applySpeedFromInput);
        } else {
            speedInput.onchange = applySpeedFromInput;
            speedInput.onblur = applySpeedFromInput;
        }

        // ---------- 游戏初始化 ----------
        function initGame() {
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }

            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            gameOver = false;
            isPaused = false;
            scoreSpan.innerHTML = '0';
            pauseBtn.innerHTML = '暂停';
            pauseBtn.style.backgroundColor = '#ff9800';
            generateFood();

            applySpeedFromInput();
            drawGame();

            if (!gameLoopInterval) {
                gameLoopInterval = setInterval(gameTick, speed);
            }
        }

        function generateFood() {
            var maxAttempts = 1000;
            var attempts = 0;
            var newFood = null;
            var foodCollision = true;

            while (foodCollision && attempts < maxAttempts) {
                newFood = {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS)
                };
                foodCollision = false;
                for (var i = 0; i < snake.length; i++) {
                    if (snake[i].x === newFood.x && snake[i].y === newFood.y) {
                        foodCollision = true;
                        break;
                    }
                }
                attempts++;
            }

            if (attempts >= maxAttempts) {
                for (var y = 0; y < ROWS; y++) {
                    for (var x = 0; x < COLS; x++) {
                        var isOccupied = false;
                        for (var i = 0; i < snake.length; i++) {
                            if (snake[i].x === x && snake[i].y === y) {
                                isOccupied = true;
                                break;
                            }
                        }
                        if (!isOccupied) {
                            newFood = { x: x, y: y };
                            break;
                        }
                    }
                    if (newFood) break;
                }
            }
            food = newFood || { x: 5, y: 5 };
        }

        function gameTick() {
            if (gameOver || isPaused) return;

            if (nextDirection === 'up' && direction !== 'down') direction = 'up';
            else if (nextDirection === 'down' && direction !== 'up') direction = 'down';
            else if (nextDirection === 'left' && direction !== 'right') direction = 'left';
            else if (nextDirection === 'right' && direction !== 'left') direction = 'right';

            var head = snake[0];
            var newHead = { x: head.x, y: head.y };

            if (direction === 'right') newHead.x += 1;
            else if (direction === 'left') newHead.x -= 1;
            else if (direction === 'up') newHead.y -= 1;
            else if (direction === 'down') newHead.y += 1;

            var isEating = (newHead.x === food.x && newHead.y === food.y);
            var newSnake = [newHead];

            if (!isEating) {
                for (var i = 0; i < snake.length - 1; i++) {
                    newSnake.push(snake[i]);
                }
            } else {
                for (var i = 0; i < snake.length; i++) {
                    newSnake.push(snake[i]);
                }
                score += 10;
                scoreSpan.innerHTML = score;
            }

            snake = newSnake;

            var headCollision = false;
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                headCollision = true;
            }
            for (var i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) {
                    headCollision = true;
                    break;
                }
            }

            if (headCollision) {
                gameOver = true;
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
                drawGame();
                return;
            }

            if (isEating) generateFood();
            drawGame();
        }

        function drawGame() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 网格线
            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 1;
            for (var i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, CANVAS_HEIGHT);
                ctx.stroke();
            }
            for (var j = 0; j <= ROWS; j++) {
                ctx.beginPath();
                ctx.moveTo(0, j * GRID_SIZE);
                ctx.lineTo(CANVAS_WIDTH, j * GRID_SIZE);
                ctx.stroke();
            }

            // 食物
            ctx.fillStyle = '#ff4d4d';
            ctx.beginPath();
            var fcX = food.x * GRID_SIZE + GRID_SIZE / 2;
            var fcY = food.y * GRID_SIZE + GRID_SIZE / 2;
            ctx.arc(fcX, fcY, GRID_SIZE / 2 - 2, 0, Math.PI * 2, false);
            ctx.fill();
            ctx.fillStyle = '#ff9999';
            ctx.beginPath();
            ctx.arc(fcX - 3, fcY - 3, 3, 0, Math.PI * 2, false);
            ctx.fill();

            // 蛇
            for (var i = 0; i < snake.length; i++) {
                var seg = snake[i];
                ctx.fillStyle = (i === 0) ? '#2e7d32' : '#4caf50';
                var x = seg.x * GRID_SIZE + 1;
                var y = seg.y * GRID_SIZE + 1;
                var w = GRID_SIZE - 2;
                var h = GRID_SIZE - 2;
                ctx.fillRect(x, y, w, h);

                if (i === 0) {
                    ctx.fillStyle = '#ffffff';
                    var eX1, eY1, eX2, eY2;
                    if (direction === 'right') {
                        eX1 = x + w - 6; eY1 = y + 4;
                        eX2 = x + w - 6; eY2 = y + h - 8;
                    } else if (direction === 'left') {
                        eX1 = x + 4; eY1 = y + 4;
                        eX2 = x + 4; eY2 = y + h - 8;
                    } else if (direction === 'up') {
                        eX1 = x + 4; eY1 = y + 4;
                        eX2 = x + w - 8; eY2 = y + 4;
                    } else {
                        eX1 = x + 4; eY1 = y + h - 8;
                        eX2 = x + w - 8; eY2 = y + h - 8;
                    }
                    ctx.beginPath();
                    ctx.arc(eX1, eY1, 3, 0, Math.PI * 2, false);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eX2, eY2, 3, 0, Math.PI * 2, false);
                    ctx.fill();
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(eX1, eY1, 1.5, 0, Math.PI * 2, false);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eX2, eY2, 1.5, 0, Math.PI * 2, false);
                    ctx.fill();
                }
            }

            // 暂停遮罩
            if (isPaused && !gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('已暂停', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
            }

            // 结束遮罩
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('游戏结束', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 20);
                ctx.font = 'bold 20px Arial';
                ctx.fillText('得分: ' + score, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 30);
            }
        }

        function setDirection(newDir) {
            if (gameOver || isPaused) return;
            if (newDir === 'up' && direction !== 'down') nextDirection = 'up';
            else if (newDir === 'down' && direction !== 'up') nextDirection = 'down';
            else if (newDir === 'left' && direction !== 'right') nextDirection = 'left';
            else if (newDir === 'right' && direction !== 'left') nextDirection = 'right';
        }

        function togglePause() {
            if (gameOver) return;
            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.innerHTML = '继续';
                pauseBtn.style.backgroundColor = '#2196F3';
                if (gameLoopInterval) {
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                }
                drawGame();
            } else {
                pauseBtn.innerHTML = '暂停';
                pauseBtn.style.backgroundColor = '#ff9800';
                if (!gameLoopInterval) {
                    gameLoopInterval = setInterval(gameTick, speed);
                }
                drawGame();
            }
        }

        // 键盘
        function handleKeyDown(e) {
            e = e || window.event;
            var key = e.keyCode || e.which;
            if (key >= 37 && key <= 40) {
                if (e.preventDefault) e.preventDefault();
                else e.returnValue = false;
            }
            if (key === 32) {
                if (e.preventDefault) e.preventDefault();
                else e.returnValue = false;
                togglePause();
                return;
            }
            if (key === 38) setDirection('up');
            else if (key === 40) setDirection('down');
            else if (key === 37) setDirection('left');
            else if (key === 39) setDirection('right');
        }

        if (window.addEventListener) {
            window.addEventListener('keydown', handleKeyDown, false);
        } else if (window.attachEvent) {
            window.attachEvent('onkeydown', handleKeyDown);
        } else {
            window.onkeydown = handleKeyDown;
        }

        // 方向按钮
        function setupMobileControls() {
            var dpadBtns = document.querySelectorAll('.dpad-btn');
            for (var i = 0; i < dpadBtns.length; i++) {
                (function(btn) {
                    var dir = btn.getAttribute('data-dir');
                    if (btn.addEventListener) {
                        btn.addEventListener('touchstart', function(e) {
                            e.preventDefault();
                            setDirection(dir);
                        }, false);
                        btn.addEventListener('click', function(e) {
                            e.preventDefault();
                            setDirection(dir);
                        }, false);
                    } else if (btn.attachEvent) {
                        btn.attachEvent('onclick', function() {
                            setDirection(dir);
                        });
                    }
                })(dpadBtns[i]);
            }
        }

        // 暂停按钮
        function pauseHandler(e) {
            if (e) e.preventDefault();
            togglePause();
        }
        if (pauseBtn.addEventListener) {
            pauseBtn.addEventListener('click', pauseHandler, false);
        } else if (pauseBtn.attachEvent) {
            pauseBtn.attachEvent('onclick', pauseHandler);
        } else {
            pauseBtn.onclick = pauseHandler;
        }

        // 重新开始按钮
        var restartBtn = document.getElementById('restartBtn');
        function restartHandler(e) {
            if (e) e.preventDefault();
            initGame();
        }
        if (restartBtn.addEventListener) {
            restartBtn.addEventListener('click', restartHandler, false);
        } else if (restartBtn.attachEvent) {
            restartBtn.attachEvent('onclick', restartHandler);
        } else {
            restartBtn.onclick = restartHandler;
        }

        // 启动
        function onLoad() {
            setupMobileControls();
            initGame();
        }
        if (window.addEventListener) {
            window.addEventListener('load', onLoad, false);
        } else if (window.attachEvent) {
            window.attachEvent('onload', onLoad);
        } else {
            window.onload = onLoad;
        }

        canvas.onselectstart = function() { return false; };
        canvas.oncontextmenu = function() { return false; };
    </script>
</body>
</html>
